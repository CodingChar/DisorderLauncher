[workspace]
resolver = "2"
members = [
    "crates/identity-api",
    "crates/identity-local",
    "crates/identity-microsoft",
    "crates/account-storage",
    "crates/credential-store",
    "crates/minecraft-meta",
    "crates/minecraft-install",
    "crates/minecraft-launch",
    "crates/java-runtime",
    "crates/download-manager",
    "crates/instance-manager",
    "crates/launcher-core",
    "crates/diagnostics",
    "crates/loaders",
    "crates/mods",
    "crates/modpacks",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "v3"] }
sha1 = "0.10"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
directories = "6"
keyring = "3"
zip = "2"
tempfile = "3"
url = "2"
md-5 = "0.10"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
