[workspace]
resolver = "2"
members = [
    "crates/identity-api",
    "crates/identity-local",
    "crates/identity-microsoft",
    "crates/account-storage",
    "crates/credential-store",
    "crates/minecraft-meta",
    "crates/minecraft-install",
    "crates/minecraft-launch",
    "crates/java-runtime",
    "crates/jvm-tuning",
    "crates/download-manager",
    "crates/instance-manager",
    "crates/launcher-core",
    "crates/diagnostics",
    "crates/loaders",
    "crates/artifact-store",
    "crates/fs-safe",
    "crates/dpack",
    "crates/mods",
    "crates/modpacks",
    "crates/themes",
    "crates/skins",
    "crates/test-support",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "v3"] }
sha1 = "0.10"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
directories = "6"
keyring = "3"
zip = "9"
tempfile = "3"
url = "2"
md-5 = "0.10"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
base64 = "0.22"
getrandom = "0.3"
zeroize = "1"

# Perfil de produccion pensado para compilar rapido (instalaciones frecuentes): sin LTO completo el
# ejecutable pesa unos MB mas pero la compilacion pasa de ~10 min a pocos. Se mantiene `panic = "unwind"`
# (por defecto): un panico en una tarea no debe cerrar el launcher ni dejar el juego sin su proceso padre.
[profile.release]
lto = false
codegen-units = 16
incremental = true
strip = "symbols"
opt-level = 3
