[package]
name = "disorderlauncher-desktop"
version = "0.1.0"
description = "DisorderLauncher - Minecraft Java Launcher"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
log = "0.4"
tracing-subscriber = { workspace = true }
launcher-core = { path = "../../../crates/launcher-core" }
identity-api = { path = "../../../crates/identity-api" }
mods = { path = "../../../crates/mods" }
modpacks = { path = "../../../crates/modpacks" }
themes = { path = "../../../crates/themes" }
skins = { path = "../../../crates/skins" }
instance-manager = { path = "../../../crates/instance-manager" }
loaders = { path = "../../../crates/loaders" }
account-storage = { path = "../../../crates/account-storage" }
minecraft-meta = { path = "../../../crates/minecraft-meta" }
